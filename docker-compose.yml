services:
  db:
    image: postgres:16-alpine
    container_name: ytbbm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ytbbm_db}
      POSTGRES_USER: ${POSTGRES_USER:-ytbbm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ytbbm_9123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ytbbm_user} -d ${POSTGRES_DB:-ytbbm_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: ytbbm_web
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - .:/app
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
