{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h2 class="fw-bold mb-4">로그인</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">사용자명 또는 이메일</label>
                        <input type="text" name="username" class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">비밀번호</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    {% if form.errors %}
                        <div class="alert alert-danger">로그인 정보가 올바르지 않습니다.</div>
                    {% endif %}
                    <button class="btn btn-dark w-100">로그인</button>
                </form>
                <div class="text-center mt-3 small">계정이 없으신가요? <a href="{% url 'signup' %}">회원가입</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
